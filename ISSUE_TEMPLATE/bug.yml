name: Bug report
description: Something in this repository doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go to security@prosentriq.com, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit you are using.
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, configuration and output. Remove enrollment keys and other secrets first.
    validations: { required: true }
